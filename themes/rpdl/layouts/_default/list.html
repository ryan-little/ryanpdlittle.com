{{ define "main" }}
<div class="list-header">
  <h1>{{ .Title }}</h1>
</div>

<div class="post-list">
  {{ range .Pages }}
  <article class="post-card" data-href="{{ .Permalink }}" tabindex="0">
    <a href="{{ .Permalink }}">
      <h2>{{ .Title }}</h2>
    </a>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      <span class="read-time">{{ .ReadingTime }} min read</span>
    </div>
    {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}<a href="{{ "tags/" | relURL }}{{ . | urlize }}/" class="tag">{{ . }}</a>{{ end }}
    </div>
    {{ end }}
    {{ with .Params.summary }}<p class="summary">{{ . }}</p>{{ end }}
  </article>
  {{ end }}
</div>

<script>
document.querySelectorAll('.post-card[data-href]').forEach(function(card) {
  card.addEventListener('click', function(e) {
    if (e.target.closest('a')) return;
    window.location.href = this.dataset.href;
  });
  card.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      window.location.href = this.dataset.href;
    }
  });
});
</script>
{{ end }}
