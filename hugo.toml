baseURL = "https://ryanpdlittle.com/"
locale = "en-us"
title = "Ryan Little"
theme = "rpdl"
enableRobotsTXT = true
ignoreFiles = [".*\\.py$"]

[params]
  subtitle = "Maps by day, code by night, San Diego always"
  description = "Blog by Ryan Little — exploring geospatial analysis, Python development, remote sensing, wildfire research, and building tools from San Diego."
  author = "Ryan Little"

[taxonomies]
  category = "categories"
  series   = "series"
  tag      = "tags"

[permalinks]
  [permalinks.term]
    categories = "/:slug/"
    series     = "/series/:slug/"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[markup]
  [markup.highlight]
    # Class-based output so each theme can carry its own palette; the actual
    # colors live in themes/rpdl/assets/css/syntax.css, scoped by [data-theme].
    # Inline styles (noClasses = true) can only bake in one palette, which is
    # why light mode used to render a dark code block.
    noClasses = false
    lineNos = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      # Required for hiking posts that embed raw HTML (Leaflet maps, Chart.js canvases)
      unsafe = true
