name: Scheduled Post Publishing

on:
  schedule:
    # Run Friday at 12:07pm PST (20:07 UTC) — shifts to 1:07pm PDT (still
    # 20:07 UTC) during daylight time (Mar–Nov). UTC is constant; local clock
    # shifts. Off-the-hour minute avoids GitHub Actions cron backlog at :00.
    - cron: '7 20 * * 5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Publish scheduled posts
        id: publish
        run: |
          python3 << 'PYTHON'
          import os, re, yaml
          from datetime import date

          today = date.today().isoformat()

          with open("publish-schedule.yml") as f:
              schedule = yaml.safe_load(f)

          posts = schedule.get("posts") or []
          published = []
          skipped = []
          missing = []
          remaining = []

          PLACEHOLDER_MARKERS = ["<!-- TODO", "RYAN"]
          MIN_BODY_CHARS = 500

          def guard_failures(post):
              """Return a list of reasons a post isn't ready to publish, or [] if it's clear."""
              fm_match = re.match(r"^---\n(.*?)\n---\n(.*)$", post, re.DOTALL)
              if not fm_match:
                  return ["missing or malformed frontmatter"]
              frontmatter, body = fm_match.group(1), fm_match.group(2)

              reasons = []

              if len(body.strip()) <= MIN_BODY_CHARS:
                  reasons.append(f"body is empty or too short (<= {MIN_BODY_CHARS} chars after frontmatter)")

              found_markers = [m for m in PLACEHOLDER_MARKERS if m in post]
              if found_markers:
                  reasons.append(f"contains placeholder marker(s): {', '.join(found_markers)}")

              summary_match = re.search(r'^summary:\s*(.*)$', frontmatter, re.MULTILINE)
              summary_value = summary_match.group(1).strip().strip('"\'') if summary_match else ""
              if not summary_value:
                  reasons.append("empty summary in frontmatter")

              return reasons

          for entry in posts:
              path, pub_date = entry["path"], str(entry["date"])

              if pub_date > today:
                  remaining.append(entry)
                  print(f"Not yet: {path} (scheduled for {pub_date})")
                  continue

              if not os.path.isfile(path):
                  remaining.append(entry)
                  missing.append({"path": path, "date": pub_date})
                  print(f"Warning: {path} not found, keeping in schedule")
                  continue

              with open(path) as f:
                  post = f.read()

              reasons = guard_failures(post)
              if reasons:
                  remaining.append(entry)
                  skipped.append({"path": path, "date": pub_date, "reasons": reasons})
                  print(f"Skipped (not written): {path} - {'; '.join(reasons)}")
                  continue

              # Flip draft flag and set publish date
              post = re.sub(r"^draft: true$", "draft: false", post, flags=re.MULTILINE)
              post = re.sub(r"^date: .*$", f"date: {pub_date}", post, flags=re.MULTILINE)
              with open(path, "w") as f:
                  f.write(post)

              # Extract title and derive URL
              title_match = re.search(r'^title:\s*["\']?(.+?)["\']?\s*$', post, re.MULTILINE)
              title = title_match.group(1) if title_match else path
              url = path.replace("content/", "/").replace("/index.md", "/").replace(".md", "/")

              published.append({"title": title, "url": url})
              print(f"Published: {title}")

          # Rewrite schedule with only remaining posts (unpublished, skipped, and missing entries)
          with open("publish-schedule.yml", "w") as f:
              f.write("# Scheduled blog post publishing\n")
              f.write("# Add posts with their target publish date. The publish workflow\n")
              f.write("# runs Friday at 12:07pm PST and will publish any post whose date has arrived.\n")
              f.write("# Once published, the entry is automatically removed from this file.\n\n")
              yaml.dump({"posts": remaining or []}, f, default_flow_style=False, sort_keys=False)

          # Build the email/summary text
          sections = []
          if published:
              lines = [f"- {p['title']}: https://ryanpdlittle.com{p['url']}" for p in published]
              sections.append("Published:\n" + "\n".join(lines))
          if skipped:
              lines = [f"- {s['path']} (scheduled {s['date']}): {'; '.join(s['reasons'])}" for s in skipped]
              sections.append("SKIPPED - not written (kept in publish-schedule.yml):\n" + "\n".join(lines))
          if missing:
              lines = [f"- {m['path']} (scheduled {m['date']})" for m in missing]
              sections.append("Missing files (kept in publish-schedule.yml):\n" + "\n".join(lines))

          # Write outputs for downstream steps
          gh_output = os.environ.get("GITHUB_OUTPUT", "/dev/null")
          with open(gh_output, "a") as out:
              out.write(f"count={len(published)}\n")
              out.write(f"report={'true' if (published or skipped or missing) else 'false'}\n")
              if sections:
                  summary = "\n\n".join(sections)
                  out.write("summary<<EOF\n")
                  out.write(summary)
                  out.write("\nEOF\n")
              if published:
                  titles = ", ".join(p["title"] for p in published)
                  out.write(f"titles={titles}\n")
          PYTHON

          # Commit and push if anything changed
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Publish scheduled posts for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Trigger deploy and wait
        id: verify
        if: steps.publish.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Record the latest deploy run ID before triggering
          before_id=$(gh run list --workflow=deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Latest deploy run before trigger: $before_id"

          # Trigger the deploy
          gh workflow run deploy.yml

          # Poll until a new run appears (up to 30 seconds)
          run_id=""
          for i in $(seq 1 15); do
            sleep 2
            run_id=$(gh run list --workflow=deploy.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ "$run_id" != "$before_id" ]; then
              break
            fi
            run_id=""
          done

          if [ -z "$run_id" ]; then
            echo "::error::Deploy run did not appear within 30 seconds"
            exit 1
          fi

          echo "Waiting for deploy run $run_id..."
          gh run watch "$run_id" --exit-status
          echo "deploy_ok=true" >> "$GITHUB_OUTPUT"
          echo "deploy_time=$(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Send publish confirmation email
        if: steps.publish.outputs.report == 'true'
        uses: dawidd6/action-send-mail@v16
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "${{ steps.publish.outputs.count != '0' && format('Post published: {0}', steps.publish.outputs.titles) || 'Scheduled publish: nothing published' }}"
          to: ${{ secrets.GMAIL_USER }}
          from: "ryanpdlittle.com <${{ secrets.GMAIL_USER }}>"
          body: |
            ${{ steps.publish.outputs.summary }}

            ${{ steps.verify.outputs.deploy_time && format('Deployed at: {0}', steps.verify.outputs.deploy_time) || 'No deploy was triggered this run.' }}
