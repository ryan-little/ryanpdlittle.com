name: Deploy Hugo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Cache processed images
        uses: actions/cache@v4
        with:
          path: resources/_gen
          key: hugo-resources-0.164.0-${{ hashFiles('content/**/*.webp', 'content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png') }}
          restore-keys: |
            hugo-resources-0.164.0-

      - name: Build
        run: hugo --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Default is 600000 (10 min). On 2026-08-06 three deploys in a row
          # aborted here: Pages accepted the deployment, went to
          # deployment_in_progress, and never reported back inside the window.
          # A normal deploy on this repo finishes in ~40s, so this ceiling only
          # matters when Pages is having a bad day. 30 min gives it room.
          timeout: 1800000
